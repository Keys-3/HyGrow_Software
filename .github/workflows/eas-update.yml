name: Publish EAS Update OTA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Setup Expo and EAS
        if: ${{ secrets.EXPO_TOKEN != '' }}
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci
        working-directory: ./FrontEnd

      - name: Publish Update
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: eas update --branch production --message "Automated OTA update from GitHub Actions"
        working-directory: ./FrontEnd
        env:
          EXPO_PUBLIC_BACKEND_URL: https://hygrow.onrender.com
          EXPO_PUBLIC_RAZORPAY_KEY_ID: rzp_test_TOnbUVLiX5gQi8

      - name: Notice when EXPO_TOKEN is missing
        if: ${{ secrets.EXPO_TOKEN == '' }}
        run: echo "::notice title=EXPO_TOKEN Missing::Add EXPO_TOKEN to repository Secrets in GitHub settings to enable automated EAS OTA updates on push."
