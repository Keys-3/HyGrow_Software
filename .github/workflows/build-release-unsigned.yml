name: Build Mobile Releases (Unsigned)

# Builds installable artifacts for personal testing, at no cost:
#   - Android: a *release* APK, signed with the project's debug keystore
#     (committed at FrontEnd/android/app/debug.keystore). This installs
#     directly on any Android phone with "install from unknown sources"
#     enabled - no Play Console, no paid account.
#   - iOS: an unsigned iPhoneOS IPA for LiveContainer or external signing.
#   - apps.json: a LiveContainer/AltStore source generated from that IPA.
#
# The app lives in FrontEnd/, not the repo root.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_NAME: HyGrow
  FRONTEND_DIR: FrontEnd
  EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL || 'https://hygrow.onrender.com' }}
  EXPO_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.EXPO_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_TOnbUVLiX5gQi8' }}
  EXPO_PUBLIC_DEVICE_ID: ${{ vars.EXPO_PUBLIC_DEVICE_ID || 'esp32-farm-001' }}

jobs:
  prepare:
    name: Reserve next release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      config_hash: ${{ steps.version.outputs.config_hash }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Reserve unique version
        id: version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/release_version.py prepare

  build-android:
    name: Build Android APK
    needs: prepare
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Set Android release version
        run: python3 scripts/release_version.py apply --version "$APP_VERSION" --build-number "$BUILD_NUMBER"

      - name: Expo prebuild
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Gradle memory
        working-directory: ${{ env.FRONTEND_DIR }}/android
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m/' gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ${{ env.FRONTEND_DIR }}/android/gradlew

      - name: Build release APK
        working-directory: ${{ env.FRONTEND_DIR }}/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=2048m' -Dorg.gradle.daemon=false"
        run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=2048m"

      - name: Print Gradle errors on failure
        if: failure()
        run: |
          echo "=== GRADLE FAILURE LOGS ==="
          find ${{ env.FRONTEND_DIR }}/android -name "*.log" | xargs cat 2>/dev/null | tail -n 100 || true
        # assembleRelease (not assembleDebug): a real release build, still
        # signed with the project's debug keystore (see app/build.gradle),
        # so it installs on any Android device with zero setup and no cost.

      - name: Prepare APK
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/release/${APP_NAME}-${{ env.RELEASE_TAG }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          compression-level: 0
          path: release/${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA (unsigned)
    needs: prepare
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Set iOS release version
        run: python3 scripts/release_version.py apply --version "$APP_VERSION" --build-number "$BUILD_NUMBER"

      - name: Expo prebuild
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Pin Node for Xcode build phases
        working-directory: ${{ env.FRONTEND_DIR }}/ios
        run: |
          NODE_PATH=$(command -v node)
          if [ -z "$NODE_PATH" ] || [ ! -x "$NODE_PATH" ]; then
            echo "Could not resolve an executable Node.js binary" >&2
            exit 1
          fi
          printf 'export NODE_BINARY="%s"\n' "$NODE_PATH" > .xcode.env
          rm -f .xcode.env.local
          echo "Xcode will use NODE_BINARY=$NODE_PATH"

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: ${{ env.FRONTEND_DIR }}/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('FrontEnd/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        working-directory: ${{ env.FRONTEND_DIR }}/ios
        run: pod install

      - name: Show Xcode information
        id: xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Determine Xcode scheme
        id: scheme
        working-directory: ${{ env.FRONTEND_DIR }}/ios
        run: |
          SCHEME=$(ls -1d *.xcodeproj | head -n1 | sed 's/\.xcodeproj//')
          if [ -z "$SCHEME" ]; then
            echo "Could not detect an Xcode scheme" >&2
            exit 1
          fi
          echo "Detected scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS app
        working-directory: ${{ env.FRONTEND_DIR }}/ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace *.xcworkspace \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Display Xcode failure logs
        if: failure()
        run: |
          echo "=== XCODEBUILD ERROR SUMMARY ==="
          grep -E "error:|fatal error:|FAILED|Signing" "$RUNNER_TEMP/xcodebuild-archive.log" | tail -n 50 || true
          echo "=== LAST 50 LINES ==="
          tail -n 50 "$RUNNER_TEMP/xcodebuild-archive.log" || true

      - name: Upload Xcode build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-archive-log
          path: ${{ runner.temp }}/xcodebuild-archive.log
          if-no-files-found: warn

      - name: Create unsigned IPA
        run: |
          mkdir -p release Payload
          APP_BUNDLE=$(find "$RUNNER_TEMP/ios-derived-data/Build/Products" \
            -type d -path "*/Release-iphoneos/${{ steps.scheme.outputs.name }}.app" -prune -print | head -n1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "No unsigned .app bundle found in DerivedData" >&2
            echo "Build products:" >&2
            find "$RUNNER_TEMP/ios-derived-data/Build/Products" -maxdepth 3 -print >&2 || true
            exit 1
          fi
          echo "Packaging app bundle: $APP_BUNDLE"
          cp -R "$APP_BUNDLE" "Payload/$(basename "$APP_BUNDLE")"

          zip -qr \
            "release/${APP_NAME}-${{ env.RELEASE_TAG }}.ipa" \
            Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          compression-level: 0
          path: release/${{ env.APP_NAME }}-${{ env.RELEASE_TAG }}.ipa
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-android
      - build-ios
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source generator
        uses: actions/checkout@v5

      - name: Download APK
        uses: actions/download-artifact@v5
        with:
          name: android-apk
          path: release

      - name: Download IPA
        uses: actions/download-artifact@v5
        with:
          name: ios-ipa
          path: release

      - name: Generate LiveContainer source
        run: |
          python3 scripts/ios_source.py \
            --ipa "release/${APP_NAME}-${RELEASE_TAG}.ipa" \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --ref "$GITHUB_SHA" --output release/apps.json

      - name: Write release notes
        run: |
          {
            echo "${{ env.APP_NAME }} Android APK + iOS IPA (unsigned) - ${{ env.RELEASE_TAG }}"
            echo ""
            echo '- **Android**: release APK, ready to install. Enable "install from unknown sources" for your file manager/browser, then open the APK.'
            echo '- **iOS**: unsigned device `.ipa` for LiveContainer or external signing with Sideloadly/AltStore. LiveContainer device operation is not verified by CI.'
            echo "- **LiveContainer source**: [apps.json](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/apps.json). Add this URL in LiveContainer Sources; it updates with each release."
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="release/${APP_NAME}-${{ env.RELEASE_TAG }}.apk"
          IPA="release/${APP_NAME}-${{ env.RELEASE_TAG }}.ipa"
          SOURCE="release/apps.json"

          if gh release view "${{ env.RELEASE_TAG }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ env.RELEASE_TAG }}" \
              --repo "${{ github.repository }}" \
              "$APK" "$IPA" "$SOURCE" \
              --clobber
            gh release edit "${{ env.RELEASE_TAG }}" \
              --repo "${{ github.repository }}" \
              --title "HyGrow $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create "${{ env.RELEASE_TAG }}" \
              --repo "${{ github.repository }}" \
              "$APK" "$IPA" "$SOURCE" \
              --target "$GITHUB_SHA" \
              --title "HyGrow $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
