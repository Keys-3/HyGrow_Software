name: Build Mobile Releases (Unsigned)

# Builds installable artifacts for personal testing, at no cost:
#   - Android: a *release* APK, signed with the project's debug keystore
#     (committed at FrontEnd/android/app/debug.keystore). This installs
#     directly on any Android phone with "install from unknown sources"
#     enabled - no Play Console, no paid account.
#   - iOS: an unsigned iPhoneOS IPA for LiveContainer or external signing.
#   - apps.json: a LiveContainer/AltStore source generated from that IPA.
#
# The app lives in FrontEnd/, not the repo root.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v1.0.0)"
        required: true
        default: "v1.0.0"

      release_name:
        description: "Release name"
        required: true
        default: "HyGrow Mobile Build"

concurrency:
  group: mobile-release-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: HyGrow
  FRONTEND_DIR: FrontEnd
  EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
  EXPO_PUBLIC_DEVICE_ID: ${{ vars.EXPO_PUBLIC_DEVICE_ID }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Expo prebuild
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Make Gradle executable
        run: chmod +x ${{ env.FRONTEND_DIR }}/android/gradlew

      - name: Build release APK
        working-directory: ${{ env.FRONTEND_DIR }}/android
        run: |
          ./gradlew assembleRelease --no-daemon --build-cache --parallel --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
        # assembleRelease (not assembleDebug): a real release build, still
        # signed with the project's debug keystore (see app/build.gradle),
        # so it installs on any Android device with zero setup and no cost.

      - name: Prepare APK
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp android/app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/release/${APP_NAME}-${{ inputs.release_tag }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          compression-level: 0
          path: release/${{ env.APP_NAME }}-${{ inputs.release_tag }}.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Expo prebuild
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Pin Node for Xcode build phases
        working-directory: ${{ env.FRONTEND_DIR }}/ios
        run: |
          NODE_PATH=$(command -v node)
          if [ -z "$NODE_PATH" ] || [ ! -x "$NODE_PATH" ]; then
            echo "Could not resolve an executable Node.js binary" >&2
            exit 1
          fi
          printf 'export NODE_BINARY="%s"\n' "$NODE_PATH" > .xcode.env
          rm -f .xcode.env.local
          echo "Xcode will use NODE_BINARY=$NODE_PATH"

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.FRONTEND_DIR }}/ios/Pods
            ${{ env.FRONTEND_DIR }}/ios/Podfile.lock
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-${{ runner.arch }}-pods-v2-${{ hashFiles('FrontEnd/package-lock.json', 'FrontEnd/app.json', 'FrontEnd/ios/Podfile', 'FrontEnd/plugins/**') }}

      - name: Install CocoaPods
        working-directory: ${{ env.FRONTEND_DIR }}/ios
        run: pod install

      - name: Show Xcode information
        id: xcode
        run: |
          xcodebuild -version
          xcode-select -p
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode compilation
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ios-derived-data
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('FrontEnd/package-lock.json', 'FrontEnd/app.json', 'FrontEnd/ios/Podfile', 'FrontEnd/plugins/**') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.version }}-${{ hashFiles('FrontEnd/package-lock.json', 'FrontEnd/app.json', 'FrontEnd/ios/Podfile', 'FrontEnd/plugins/**') }}-

      - name: Determine Xcode scheme
        id: scheme
        working-directory: ${{ env.FRONTEND_DIR }}/ios
        run: |
          # Expo prebuild creates an Xcode project matching the app name.
          # The main scheme is exactly the name of the .xcodeproj.
          SCHEME=$(ls -1d *.xcodeproj | head -n1 | sed 's/\.xcodeproj//')
          if [ -z "$SCHEME" ]; then
            echo "Could not detect an Xcode scheme" >&2
            exit 1
          fi
          echo "Detected scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS app
        working-directory: ${{ env.FRONTEND_DIR }}/ios
        run: |
          set -o pipefail
          # Build directly into a known DerivedData directory. An unsigned
          # archive is not needed for an installable test IPA, and on recent
          # Xcode versions an unsigned archive may not contain
          # Products/Applications at the path used by the old packaging step.
          xcodebuild \
            -workspace *.xcworkspace \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-archive.log"

      - name: Upload Xcode build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: xcodebuild-archive-log
          path: ${{ runner.temp }}/xcodebuild-archive.log
          if-no-files-found: warn

      - name: Create unsigned IPA
        run: |
          mkdir -p release Payload
          APP_BUNDLE=$(find "$RUNNER_TEMP/ios-derived-data/Build/Products" \
            -type d -path "*/Release-iphoneos/${{ steps.scheme.outputs.name }}.app" -prune -print | head -n1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "No unsigned .app bundle found in DerivedData" >&2
            echo "Build products:" >&2
            find "$RUNNER_TEMP/ios-derived-data/Build/Products" -maxdepth 3 -print >&2 || true
            exit 1
          fi
          echo "Packaging app bundle: $APP_BUNDLE"
          cp -R "$APP_BUNDLE" "Payload/$(basename "$APP_BUNDLE")"

          zip -qr \
            "release/${APP_NAME}-${{ inputs.release_tag }}.ipa" \
            Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          compression-level: 0
          path: release/${{ env.APP_NAME }}-${{ inputs.release_tag }}.ipa
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source generator
        uses: actions/checkout@v5

      - name: Download APK
        uses: actions/download-artifact@v5
        with:
          name: android-apk
          path: release

      - name: Download IPA
        uses: actions/download-artifact@v5
        with:
          name: ios-ipa
          path: release

      - name: Generate LiveContainer source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/ios_source.py \
            --ipa "release/${APP_NAME}-${RELEASE_TAG}.ipa" \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --ref "$GITHUB_SHA" --output release/apps.json

      - name: Write release notes
        run: |
          {
            echo "${{ env.APP_NAME }} Android APK + iOS IPA (unsigned) - ${{ inputs.release_tag }}"
            echo ""
            echo '- **Android**: release APK, ready to install. Enable "install from unknown sources" for your file manager/browser, then open the APK.'
            echo '- **iOS**: unsigned device `.ipa` for LiveContainer or external signing with Sideloadly/AltStore. LiveContainer device operation is not verified by CI.'
            echo "- **LiveContainer source**: [apps.json](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/apps.json). Add this URL in LiveContainer Sources; it updates with each release."
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="release/${APP_NAME}-${{ inputs.release_tag }}.apk"
          IPA="release/${APP_NAME}-${{ inputs.release_tag }}.ipa"
          SOURCE="release/apps.json"

          if gh release view "${{ inputs.release_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.release_tag }}" \
              --repo "${{ github.repository }}" \
              "$APK" "$IPA" "$SOURCE" \
              --clobber
            gh release edit "${{ inputs.release_tag }}" \
              --repo "${{ github.repository }}" \
              --title "${{ inputs.release_name }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create "${{ inputs.release_tag }}" \
              --repo "${{ github.repository }}" \
              "$APK" "$IPA" "$SOURCE" \
              --target "$GITHUB_SHA" \
              --title "${{ inputs.release_name }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
